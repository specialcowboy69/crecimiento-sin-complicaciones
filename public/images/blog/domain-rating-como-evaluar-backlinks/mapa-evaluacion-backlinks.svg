<svg xmlns="http://www.w3.org/2000/svg" width="320" height="760" viewBox="0 0 320 760" role="img" aria-labelledby="title description">
  <title id="title">Mapa para evaluar un backlink más allá del Domain Rating</title>
  <desc id="description">El DR sirve como filtro inicial. La evaluación continúa con el contexto editorial, la calidad de la publicación y la utilidad para el negocio. Después se decide si descartar, investigar o considerar la oportunidad.</desc>
  <rect x="0.5" y="0.5" width="319" height="759" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="18" y="38" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Un backlink en contexto</text>
  <text x="18" y="62" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14">El DR abre la revisión; no la cierra.</text>

  <rect x="18" y="82" width="284" height="64" rx="6" fill="#e8efff" stroke="#b7c9f0"/>
  <text x="32" y="108" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">DR · FILTRO INICIAL</text>
  <text x="32" y="131" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14">Métrica relativa del dominio</text>
  <path d="M160 146 V164" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M154 159 L160 165 L166 159" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="18" y="166" width="284" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="18" y="166" width="4" height="132" rx="2" fill="#0f766e"/>
  <text x="34" y="194" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">01  CONTEXTO EDITORIAL</text>
  <text x="34" y="228" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Relevancia de la página</text>
  <text x="34" y="263" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Motivo útil para el lector</text>
  <path d="M160 298 V316" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M154 311 L160 317 L166 311" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="18" y="318" width="284" height="168" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="18" y="318" width="4" height="168" rx="2" fill="#2563eb"/>
  <text x="34" y="346" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">02  CALIDAD DE LA PUBLICACIÓN</text>
  <text x="34" y="380" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Contenido útil y mantenido</text>
  <text x="34" y="415" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Patrón de enlaces salientes</text>
  <text x="34" y="450" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Texto ancla natural</text>
  <path d="M160 486 V504" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M154 499 L160 505 L166 499" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="18" y="506" width="284" height="132" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="18" y="506" width="4" height="132" rx="2" fill="#0f766e"/>
  <text x="34" y="534" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">03  VERIFICACIÓN Y NEGOCIO</text>
  <text x="34" y="568" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Rastreo y enlace accesible</text>
  <text x="34" y="603" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16">Público y oferta alineados</text>
  <path d="M160 638 V656" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M154 651 L160 657 L166 651" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="18" y="658" width="284" height="82" rx="6" fill="#eaf5f2" stroke="#a8d5c9"/>
  <text x="32" y="687" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">DECISIÓN EDITORIAL</text>
  <text x="32" y="718" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="14">Descartar · Investigar · Considerar</text>
</svg>
