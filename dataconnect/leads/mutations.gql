mutation CreateLead(
  $sourcePage: String!
  $sourcePath: String
  $formType: String!
  $name: String!
  $contact: String!
  $company: String
  $message: String
  $interestedService: String
  $adsClickType: String
  $adsClickId: String
  $adsMeasurementConsentAtSubmit: Boolean
  $adsConsentVersion: String
) @auth(level: NO_ACCESS) {
  lead_insert(
    data: {
      sourcePage: $sourcePage
      sourcePath: $sourcePath
      formType: $formType
      name: $name
      contact: $contact
      company: $company
      message: $message
      interestedService: $interestedService
      adsClickType: $adsClickType
      adsClickId: $adsClickId
      adsMeasurementConsentAtSubmit: $adsMeasurementConsentAtSubmit
      adsConsentVersion: $adsConsentVersion
    }
  )
}

mutation UpdateLeadStatus($id: UUID!, $status: String!) @auth(level: NO_ACCESS) {
  lead_update(key: { id: $id }, data: { status: $status, updatedAt_expr: "request.time" })
}

mutation MarkLeadQualified($id: UUID!) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: { id: { eq: $id }, qualifiedAt: { isNull: true } }
    data: { status: "qualified", qualifiedAt_expr: "request.time", updatedAt_expr: "request.time" }
  )
}

mutation BlockLeadAdsExport($id: UUID!) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: { id: { eq: $id }, adsExportBlockedAt: { isNull: true }, adsExportClaimedAt: { isNull: true }, adsExportSubmittedAt: { isNull: true } }
    data: { adsExportBlockedAt_expr: "request.time", updatedAt_expr: "request.time" }
  )
}

mutation ClaimLeadAdsExport($id: UUID!) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: {
      id: { eq: $id }
      sourcePath: { eq: "/seo/local" }
      status: { eq: "qualified" }
      adsMeasurementConsentAtSubmit: { eq: true }
      adsClickId: { isNull: false }
      qualifiedAt: { isNull: false }
      adsExportBlockedAt: { isNull: true }
      adsExportClaimedAt: { isNull: true }
      adsExportSubmittedAt: { isNull: true }
      adsExportTerminalAt: { isNull: true }
    }
    data: { adsExportClaimedAt_expr: "request.time" }
  )
}

mutation ReleaseStaleLeadAdsExportClaims($before: Timestamp!) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: { adsExportClaimedAt: { lt: $before }, adsExportSubmittedAt: { isNull: true } }
    data: { adsExportClaimedAt: null }
  )
}

mutation MarkLeadAdsExportSubmitted($id: UUID!) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: { id: { eq: $id }, adsExportClaimedAt: { isNull: false }, adsExportSubmittedAt: { isNull: true } }
    data: {
      adsExportSubmittedAt_expr: "request.time"
      adsExportClaimedAt: null
      adsExportAttemptedAt_expr: "request.time"
      adsExportLastErrorCode: null
      updatedAt_expr: "request.time"
    }
  )
}

mutation RecordLeadAdsExportFailure($id: UUID!, $code: String!, $terminalAt: Timestamp) @auth(level: NO_ACCESS) {
  updated: lead_updateMany(
    where: { id: { eq: $id }, adsExportClaimedAt: { isNull: false }, adsExportSubmittedAt: { isNull: true }, adsExportTerminalAt: { isNull: true } }
    data: {
      adsExportAttemptedAt_expr: "request.time"
      adsExportClaimedAt: null
      adsExportTerminalAt: $terminalAt
      adsExportLastErrorCode: $code
      updatedAt_expr: "request.time"
    }
  )
}

mutation DeleteLead($id: UUID!) @auth(level: NO_ACCESS) {
  lead_delete(key: { id: $id })
}

mutation DeleteLeadIfNotExporting($id: UUID!) @auth(level: NO_ACCESS) {
  deleted: lead_deleteMany(where: { id: { eq: $id }, adsExportClaimedAt: { isNull: true } })
}
