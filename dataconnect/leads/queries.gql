query ListLeads @auth(level: NO_ACCESS) {
  leads(orderBy: [{ createdAt: DESC }]) {
    id
    sourcePage
    sourcePath
    formType
    name
    contact
    company
    message
    interestedService
    status
    adsClickType
    adsMeasurementConsentAtSubmit
    qualifiedAt
    adsExportBlockedAt
    adsExportClaimedAt
    adsExportSubmittedAt
    adsExportAttemptedAt
    adsExportTerminalAt
    adsExportLastErrorCode
    createdAt
    updatedAt
  }
}

query ListLeadsBySource($sourcePage: String!) @auth(level: NO_ACCESS) {
  leads(where: { sourcePage: { eq: $sourcePage } }, orderBy: [{ createdAt: DESC }]) {
    id
    sourcePage
    sourcePath
    formType
    name
    contact
    company
    message
    interestedService
    status
    adsClickType
    adsMeasurementConsentAtSubmit
    qualifiedAt
    adsExportBlockedAt
    adsExportClaimedAt
    adsExportSubmittedAt
    adsExportAttemptedAt
    adsExportTerminalAt
    adsExportLastErrorCode
    createdAt
    updatedAt
  }
}

query GetLeadForAdmin($id: UUID!) @auth(level: NO_ACCESS) {
  leads(where: { id: { eq: $id } }, limit: 1) {
    id
    status
    qualifiedAt
    adsExportBlockedAt
    adsExportClaimedAt
    adsExportSubmittedAt
    adsExportAttemptedAt
    adsExportTerminalAt
    adsExportLastErrorCode
  }
}

query ListQualifiedLeadsForAdsExport @auth(level: NO_ACCESS) {
  leads(
    where: {
      sourcePath: { eq: "/seo/local" }
      status: { eq: "qualified" }
      adsMeasurementConsentAtSubmit: { eq: true }
      adsClickId: { isNull: false }
      qualifiedAt: { isNull: false }
      adsExportBlockedAt: { isNull: true }
      adsExportClaimedAt: { isNull: true }
      adsExportSubmittedAt: { isNull: true }
      adsExportTerminalAt: { isNull: true }
    }
    orderBy: [{ qualifiedAt: ASC }]
    limit: 100
  ) {
    id
    sourcePath
    status
    adsClickType
    adsClickId
    adsMeasurementConsentAtSubmit
    qualifiedAt
    adsExportBlockedAt
    adsExportClaimedAt
    adsExportSubmittedAt
    adsExportAttemptedAt
    adsExportTerminalAt
    adsExportLastErrorCode
  }
}
