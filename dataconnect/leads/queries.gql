query ListLeads @auth(level: NO_ACCESS) {
  leads(orderBy: [{ createdAt: DESC }]) {
    id
    sourcePage
    sourcePath
    formType
    name
    contact
    company
    message
    interestedService
    status
    adsClickType
    adsMeasurementConsentAtSubmit
    qualifiedAt
    adsExportBlockedAt
    adsExportSubmittedAt
    createdAt
    updatedAt
  }
}

query ListLeadsBySource($sourcePage: String!) @auth(level: NO_ACCESS) {
  leads(where: { sourcePage: { eq: $sourcePage } }, orderBy: [{ createdAt: DESC }]) {
    id
    sourcePage
    sourcePath
    formType
    name
    contact
    company
    message
    interestedService
    status
    adsClickType
    adsMeasurementConsentAtSubmit
    qualifiedAt
    adsExportBlockedAt
    adsExportSubmittedAt
    createdAt
    updatedAt
  }
}

query GetLeadForAdmin($id: UUID!) @auth(level: NO_ACCESS) {
  leads(where: { id: { eq: $id } }, limit: 1) {
    id
    status
    qualifiedAt
    adsExportBlockedAt
    adsExportSubmittedAt
  }
}
